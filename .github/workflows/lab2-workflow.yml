name: Exploring Workflow Dispatch Trigger

on:
  workflow_dispatch:
   inputs:
    run_job:
     description: "Run Specific Job"
     type: boolean
     required: true
    custom_message:
        description: "Enter a custom message"
        type: string
        required: true
env:   # repository-level debug variable
  ACTIONS_STEP_DEBUG: "true"
  
jobs:
  job2:
    runs-on: ubuntu-latest
    steps:
     - name: Printing Custom Message
       run: echo "${{ github.event.inputs.custom_message }}"
     - name: Printing run-job boolean value
       if: ${{ github.event.inputs.run_job == true }} || inputs.run_job
       run: echo "${{ toJson(inputs.run_job) }}"




